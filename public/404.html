<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holy Quran - Complete Quran App</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g., https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for some
      // browsers to see it. Otherwise you may see a default GitHub 404 page.

      // For Project Pages (username.github.io/repository-name)
      // Set segmentCount to 1 for repository name
      // For User Pages (username.github.io), set to 0
      // Since your URL is mahendarmax.github.io (no repo in path), this is a user page
      var segmentCount = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- This file needs to be at least 512 bytes for GitHub Pages to serve it properly -->
    <!-- Padding to ensure file size requirement -->
    <p style="display:none;">This is a Single Page Application (SPA) redirect page for GitHub Pages. If you see this message, the redirect script should have already executed. Please wait a moment or refresh the page.</p>
  </body>
</html>
